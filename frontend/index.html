<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Matheus OS</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="v" aria-live="polite"></main>

  <nav class="tab-bar" aria-label="Navegação principal">
    <button class="today-tab" data-action="tab" data-view="today"><span class="nav-icon">⌂</span><span>Hoje</span></button>
    <button data-action="tab" data-view="map"><span class="nav-icon">◈</span><span>Mapa</span></button>
    <button class="capture-button" data-action="capture" aria-label="Capturar"><span>+</span></button>
    <button data-action="tab" data-view="projects"><span class="nav-icon">▦</span><span>Projetos</span></button>
    <button data-action="tab" data-view="me"><span class="nav-icon">✦</span><span>Eu</span></button>
  </nav>

  <div id="sheet" aria-hidden="true"><div id="sheetContent"></div></div>
  <div id="toast" role="status"></div>

  <div id="authGate" class="auth-gate">
    <div class="auth-card">
      <h2>Matheus OS</h2>
      <p>Entre para sincronizar seu espaço de pensamento.</p>
      <button id="googleLoginBtn" type="button">Entrar com Google</button>
    </div>
  </div>

  <div id="migrationGate" class="auth-gate hidden">
    <div class="auth-card">
      <h2>Dados antigos encontrados</h2>
      <p>Encontramos dados antigos deste navegador.</p>
      <button id="migrationImportBtn" type="button">Importar para minha conta</button>
      <button id="migrationIgnoreBtn" class="secondary" type="button">Ignorar</button>
    </div>
  </div>

  <div id="migrationGate" class="auth-gate hidden">
    <div class="auth-card">
      <h2>Dados antigos encontrados</h2>
      <p>Encontramos dados antigos deste navegador.</p>
      <button id="migrationImportBtn" type="button">Importar para minha conta</button>
      <button id="migrationIgnoreBtn" class="secondary" type="button">Ignorar</button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
